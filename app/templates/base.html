<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />

    <title>{% block title %}Quizzy | Challenge Your Mind{% endblock %}</title>
    <meta
      name="description"
      content="Challenge your knowledge with Quizzy, your interactive quiz platform."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Main navigation">
        <a class="brand" href="{{ url_for('main.home') }}">
          <span class="brand-mark" aria-hidden="true">Q</span>
          <span>quizzy<span class="brand-dot">.</span></span>
        </a>

        <div class="nav-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
            title="Toggle theme"
          >
            <span id="theme-icon" aria-hidden="true">☀</span>
          </button>
        </div>
      </nav>
    </header>

    <main id="main-content">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="brand footer-brand" href="{{ url_for('main.home') }}">
          <span>quizzy<span class="brand-dot">.</span></span>
        </a>
        <p>Made for curious minds.</p>
      </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/motion@12.23.24/dist/motion.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
    {% block scripts %}{% endblock %}

  </body>
</html>
